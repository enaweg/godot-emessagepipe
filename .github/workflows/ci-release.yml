name: CI-Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    name: Read version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Initialize version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # ePlugin before 0.10.0 rejects pre-release suffixes in plugin versions, and eMessagePipe accepts any ePlugin
          # version, so release tags stay numeric.
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR[.PATCH[.REVISION]]."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    uses: ./.github/workflows/build-test.yml

  draft-release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 200
          fetch-tags: true

      - name: Set Version to plugin.cfg
        shell: bash
        run: |
          sed -i "s/version=\".*\"/version=\"${{ env.VERSION }}\"/g" src/emessagepipe/addons/eMessagePipe/plugin.cfg

      - name: Hide plugin and optional integration source for distribution
        shell: bash
        run: |
          mv src/emessagepipe/addons/eMessagePipe/src src/emessagepipe/addons/eMessagePipe/.src
          test -d src/emessagepipe/addons/eMessagePipe/.src
          test ! -e src/emessagepipe/addons/eMessagePipe/src
          mv src/emessagepipe/addons/eMessagePipe/src-econtainer src/emessagepipe/addons/eMessagePipe/.src-econtainer
          test -d src/emessagepipe/addons/eMessagePipe/.src-econtainer
          test ! -e src/emessagepipe/addons/eMessagePipe/src-econtainer

      - name: Create artifact
        shell: bash
        run: |
          mkdir out/
          cp LICENSE src/emessagepipe/addons/eMessagePipe/LICENSE
          cd src/emessagepipe
          zip -r ../../out/eMessagePipe-v${VERSION}.zip addons/eMessagePipe

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6.4.0
        with:
          mode: "HYBRID"
          configurationJson: |
            {
               "template": "#{{CHANGELOG}}\n",
               "categories": [
                 {
                     "title": "## Feature",
                     "labels": ["feat", "feature"]
                 },
                 {
                     "title": "## Fix",
                     "labels": ["fix", "bug"]
                 },
                 {
                     "title": "## Other",
                     "labels": []
                 }
               ],
               "ignore_labels": [
                 "ignore"
               ],
               "label_extractor": [
                 {
                   "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)",
                   "on_property": "title",
                   "target": "$1"
                 }
               ],
              "tag_resolver": {
                "method": "semver",
                "filter": {
                  "pattern": "v(.+)",
                  "flags": "gu"
                }
              }
             }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: "eMessagePipe-v${{ env.VERSION }}"
          body: ${{ steps.build_changelog.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          artifacts: "out/eMessagePipe-v${{ env.VERSION }}.zip"
